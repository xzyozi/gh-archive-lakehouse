version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: octopulse-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    PYTHONPATH: /opt/airflow/src
    GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-octopulse-lakehouse}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    # BigQuery dataset prefix. Used by both the DAG and dbt (generate_schema_name macro / sources.yml).
    GCP_DATASET_PREFIX: ${GCP_DATASET_PREFIX:-octopulse}
    # dbt target in profiles.yml (dev / prod)
    DBT_TARGET: ${DBT_TARGET:-dev}
    # The dbt project is mounted read-only, so dbt writes its artifacts and logs to /tmp.
    DBT_TARGET_PATH: /tmp/dbt_target
    DBT_LOG_PATH: /tmp/dbt_logs
    # Read-only fine-grained PAT for GitHub GraphQL API enrichment (DD-002 4)
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/src:ro
    # dbt project (read-only) and its profile. The profile is the single source with the guardrail
    # (maximum_bytes_billed); it is mounted as profiles.yml because Cosmos requires that file name.
    - ../dbt:/opt/airflow/dbt:ro
    - ../dbt/profiles.yml.example:/opt/airflow/dbt_profiles/profiles.yml:ro
    # Mount host Google Cloud ADC in read-only mode (No fixed key files)
    # Override GCLOUD_CONFIG_DIR in .env when ADC lives elsewhere (e.g. Windows: %APPDATA%\gcloud)
    - ${GCLOUD_CONFIG_DIR:-~/.config/gcloud}:/home/airflow/.config/gcloud:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in airflow/.env}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8974/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
